name: iOS App Store

# Builds the signed iOS IPA and uploads it to App Store Connect, the same way
# klipa does for the Mac App Store. Runs on a version tag once the required
# secrets are set; otherwise it prints a notice and skips.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_API_KEY_P8_BASE64   (App Store Connect API key)  <- already set
#   IOS_DIST_CERT_P12_BASE64      base64 of a .p12 holding the "Apple Distribution" identity
#   IOS_DIST_CERT_P12_PASSWORD    password for that .p12
#   IOS_PROVISION_PROFILE_BASE64  base64 of the App Store .mobileprovision for dev.peterdsp.lidhra
#   CI_KEYCHAIN_PASSWORD          any throwaway password for the temp CI keychain
#   TEAMID                        Apple team id (YTS4KJBX3P)
#
# One-time prerequisite: the Lidhra app RECORD must exist in App Store Connect.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      IOS_DIST_CERT_P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_P12_PASSWORD }}
      IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
      TEAMID: ${{ secrets.APPLE_TEAM_ID }}
      # Names `tauri ios build` reads to do MANUAL signing (from the same secrets).
      # Without these, Tauri falls back to automatic signing, which needs an Apple
      # account logged into Xcode and fails on CI with "No Accounts" / "No profiles".
      IOS_CERTIFICATE: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERT_P12_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      # App Store now requires the iOS 26 SDK (Xcode 26). macos-26 ships it, but
      # the default Xcode can still be an older one, so select the latest stable.
      - name: Select latest stable Xcode (iOS 26 SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Skip if signing secrets are not set
        id: gate
        run: |
          if [ -z "$IOS_DIST_CERT_P12_BASE64" ] || [ -z "$ASC_API_KEY_P8_BASE64" ]; then
            echo "iOS App Store secrets not set - skipping build + upload."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.run == 'true'
        with:
          targets: aarch64-apple-ios

      - name: Install Tauri CLI
        if: steps.gate.outputs.run == 'true'
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install CocoaPods
        if: steps.gate.outputs.run == 'true'
        run: gem install cocoapods --no-document || brew install cocoapods

      - name: Build + upload to App Store Connect
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          echo "Toolchain: $(xcodebuild -version | tr '\n' ' ') | iphoneos SDK $(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null)"
          # 1. Import the iOS distribution cert into a temp keychain.
          KEYCHAIN="$RUNNER_TEMP/ios.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/ios.p12"
          security import "$RUNNER_TEMP/ios.p12" -k "$KEYCHAIN" -P "$IOS_DIST_CERT_P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/ios.p12"

          # 2. Install the provisioning profile and read its identity.
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE="$HOME/Library/MobileDevice/Provisioning Profiles/lidhra.mobileprovision"
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 -d > "$PROFILE"
          PLIST="$(security cms -D -i "$PROFILE" 2>/dev/null)"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$PLIST")"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$PLIST")"
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /dev/stdin <<< "$PLIST" 2>/dev/null || true)"
          HAS_DEVICES="$(/usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' /dev/stdin <<< "$PLIST" >/dev/null 2>&1 && echo yes || echo no)"
          echo "Provisioning profile: name='$PROFILE_NAME' uuid='$PROFILE_UUID' app-id='$APP_ID' has-devices='$HAS_DEVICES'"
          # An App Store distribution profile lists no devices. If it does, it is a
          # development/ad-hoc profile and cannot be uploaded to the App Store.
          if [ "$HAS_DEVICES" = "yes" ]; then
            echo "::error::IOS_PROVISION_PROFILE_BASE64 is a development/ad-hoc profile (it lists devices). Store the App Store distribution profile for dev.peterdsp.lidhra instead."; exit 1
          fi
          # Xcode discovers profiles by scanning this dir; also install under its UUID.
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          # 3. App Store Connect API key for altool.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_API_KEY_P8_BASE64" | base64 -d > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          # 4. Switch to the App Store flavor and verify. A silent failure here would
          #    ship the Ko-fi trial + "Buy on Ko-fi" UI and get rejected under 3.1.1.
          sed -i '' 's/^default = \["kofi"\]/default = ["appstore"]/' app/src-tauri/Cargo.toml
          grep -q '^default = \["appstore"\]' app/src-tauri/Cargo.toml \
            || { echo "::error::appstore feature not enabled - refusing to ship the Ko-fi build to the App Store"; exit 1; }

          # 5. Generate the Xcode project, then select our App Store profile. Tauri
          #    keeps CODE_SIGN_STYLE=Manual (from IOS_MOBILE_PROVISION) but does not
          #    pick a profile, so xcodebuild fails with "requires a provisioning
          #    profile" until we set the specifier on the generated project.
          ( cd app && cargo tauri ios init --ci --skip-targets-install )
          gem install xcodeproj --no-document --quiet
          TAURI_PBXPROJ="app/src-tauri/gen/apple/lidhra-desktop.xcodeproj" PROFILE_NAME="$PROFILE_NAME" ruby -e '
            require "xcodeproj"
            proj = Xcodeproj::Project.open(ENV["TAURI_PBXPROJ"])
            proj.targets.each do |t|
              t.build_configurations.each do |c|
                bs = c.build_settings
                bs["CODE_SIGN_STYLE"] = "Manual"
                bs["DEVELOPMENT_TEAM"] = ENV["TEAMID"]
                bs["CODE_SIGN_IDENTITY"] = "Apple Distribution"
                bs["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = "Apple Distribution"
                bs["PROVISIONING_PROFILE_SPECIFIER"] = ENV["PROFILE_NAME"]
              end
            end
            proj.save
            puts "Patched signing (team=#{ENV["TEAMID"]}, profile=#{ENV["PROFILE_NAME"]}) for: #{proj.targets.map(&:name).join(", ")}"
          '

          # 6. Build the signed IPA.
          ( cd app && APPLE_DEVELOPMENT_TEAM="$TEAMID" cargo tauri ios build --export-method app-store-connect )

          IPA=$(ls -t app/src-tauri/gen/apple/build/**/*.ipa 2>/dev/null | head -1)
          echo "IPA: $IPA"

          # 5. Validate + upload.
          xcrun altool --validate-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app  -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded $IPA to App Store Connect."
