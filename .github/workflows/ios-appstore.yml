name: iOS App Store

# Builds the signed iOS IPA and uploads it to App Store Connect, the same way
# klipa does for the Mac App Store. Runs on a version tag once the required
# secrets are set; otherwise it prints a notice and skips.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_API_KEY_P8_BASE64   (App Store Connect API key)  <- already set
#   IOS_DIST_CERT_P12_BASE64      base64 of a .p12 holding the "Apple Distribution" identity
#   IOS_DIST_CERT_P12_PASSWORD    password for that .p12
#   IOS_PROVISION_PROFILE_BASE64  base64 of the App Store .mobileprovision for dev.peterdsp.lidhra
#   CI_KEYCHAIN_PASSWORD          any throwaway password for the temp CI keychain
#   TEAMID                        Apple team id (YTS4KJBX3P)
#
# One-time prerequisite: the Lidhra app RECORD must exist in App Store Connect.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      IOS_DIST_CERT_P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_P12_PASSWORD }}
      IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
      TEAMID: ${{ secrets.APPLE_TEAM_ID }}
      # App Store Connect API key: lets Xcode do automatic signing on CI with no
      # logged-in Apple account (it creates/downloads the Apple Distribution cert
      # and App Store profile itself). This key must have Admin access.
      APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_API_KEY: ${{ secrets.ASC_KEY_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if signing secrets are not set
        id: gate
        run: |
          if [ -z "$IOS_DIST_CERT_P12_BASE64" ] || [ -z "$ASC_API_KEY_P8_BASE64" ]; then
            echo "iOS App Store secrets not set - skipping build + upload."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.run == 'true'
        with:
          targets: aarch64-apple-ios

      - name: Install Tauri CLI
        if: steps.gate.outputs.run == 'true'
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install CocoaPods
        if: steps.gate.outputs.run == 'true'
        run: gem install cocoapods --no-document || brew install cocoapods

      - name: Build + upload to App Store Connect
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          # 1. A keychain for Xcode to store the Apple Distribution certificate it
          #    creates or downloads via the App Store Connect API key.
          KEYCHAIN="$RUNNER_TEMP/ios.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"

          # 2. App Store Connect API key, used for BOTH automatic signing and upload.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_P8="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_API_KEY_P8_BASE64" | base64 -d > "$KEY_P8"
          export APPLE_API_KEY_PATH="$KEY_P8"

          # 3. Switch to the App Store flavor and verify. A silent failure here would
          #    ship the Ko-fi trial + "Buy on Ko-fi" UI and get rejected under 3.1.1.
          sed -i '' 's/^default = \["kofi"\]/default = ["appstore"]/' app/src-tauri/Cargo.toml
          grep -q '^default = \["appstore"\]' app/src-tauri/Cargo.toml \
            || { echo "::error::appstore feature not enabled - refusing to ship the Ko-fi build to the App Store"; exit 1; }

          # 4. Build with automatic signing. APPLE_API_ISSUER / APPLE_API_KEY /
          #    APPLE_API_KEY_PATH let Xcode create or download the Apple Distribution
          #    cert + App Store profile with no logged-in Apple account.
          ( cd app && cargo tauri ios init --ci --skip-targets-install )
          ( cd app && APPLE_DEVELOPMENT_TEAM="$TEAMID" cargo tauri ios build --export-method app-store-connect )

          IPA=$(ls -t app/src-tauri/gen/apple/build/**/*.ipa 2>/dev/null | head -1)
          echo "IPA: $IPA"

          # 5. Validate + upload.
          xcrun altool --validate-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app  -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded $IPA to App Store Connect."
