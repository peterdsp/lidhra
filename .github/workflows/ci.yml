name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: build · test · clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - name: Build
        run: cargo build --workspace --verbose
      - name: Test
        run: cargo test --workspace --verbose
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  web:
    name: adaptive layout tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Pure geometry / layout logic extracted from ui/index.html. No upload,
      # no native build; just the shared adaptive math the foldable UI depends on.
      - name: Adaptive layout unit tests
        run: node --test test/adaptive.test.mjs
