[package]
name = "lidhra-desktop"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Lidhra desktop app - a Tauri shell wrapping the shared web UI and the debrid + transfer engine."

# Not part of the crates/ workspace: Tauri needs a system webview
# (WebKit / WebView2 / WebKitGTK) that the headless CI doesn't have.
[workspace]

[lib]
name = "lidhra_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Ko-fi / direct build: 7-day trial + license + auto-update.
default = ["kofi", "p2p"]
kofi = ["dep:tauri-plugin-updater"]
# App Store build: paid upfront, no trial and no self-update (store handles both).
appstore = []
# On-device BitTorrent: magnets download directly when no debrid account is
# connected. Independent of the store flavor; remove it from `default` (the CI
# sed keeps it) to ship a debrid-only binary.
p2p = ["dep:lidhra-torrent"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Only to install the process-wide crypto provider (see `run`); already in the tree via reqwest.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
lidhra-debrid = { path = "../../crates/lidhra-debrid" }
lidhra-transfer = { path = "../../crates/lidhra-transfer" }
lidhra-license = { path = "../../crates/lidhra-license" }
lidhra-torrent = { path = "../../crates/lidhra-torrent", optional = true }
tauri-plugin-opener = "2"
tauri-plugin-lidhra-native = { path = "plugins/native" }

# See crates/vendor/README.md: one cfg fix so librqbit builds for iOS.
[patch.crates-io]
librqbit-dualstack-sockets = { path = "../../crates/vendor/librqbit-dualstack-sockets" }
